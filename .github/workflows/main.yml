name: Build APK and AAB
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create Project Folder
        run: |
          mkdir www
          cp index.html www/
          if [ -f icon.png ]; then cp icon.png www/; fi

      - name: Install Capacitor and Capacitor Assets
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "VoiceRecorder" "com.example.myapp" --web-dir=www

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Generate App Icons Automatically
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            cp icon.png assets/icon-background.png
            npx capacitor-assets generate --android
          fi

      - name: Build Android App (APK & AAB)
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Upload APK and AAB Files
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-Files
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
