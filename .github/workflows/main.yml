name: Build APK and AAB from Single File
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Project
        run: |
          cordova create myapp com.example.myapp "VoiceRecorder"
          rm -rf myapp/www/*
          cp index.html myapp/www/
          
          cd myapp
          
          # एंड्रॉइड को साफ़ तौर पर बताना कि ऐप को माइक रिकॉर्डिंग की परमिशन चाहिए
          echo '<config-file target="AndroidManifest.xml" parent="/*">' > plugin_config.xml
          echo '    <uses-permission android:name="android.permission.RECORD_AUDIO" />' >> plugin_config.xml
          echo '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' >> plugin_config.xml
          echo '</config-file>' >> plugin_config.xml
          
          # config.xml फ़ाइल के अंदर परमिशन टैग्स को सुरक्षित तरीके से जोड़ना
          sed -i '/<\/widget>/r plugin_config.xml' config.xml
          
          cordova platform add android

      - name: Build APK (For Testing)
        run: |
          cd myapp
          cordova build android --debug --max-workers=2

      - name: Build AAB (For Play Store)
        run: |
          cd myapp
          cordova build android --release -- --packageType=bundle

      - name: Upload Files
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-Files
          path: |
            myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
            myapp/platforms/android/app/build/outputs/bundle/release/app-release.aab
