name: Build APK and AAB from Single File
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Project
        run: |
          cordova create myapp com.example.myapp "VoiceRecorder"
          rm -rf myapp/www/*
          cp index.html myapp/www/
          
          # लोगो को प्रोजेक्ट के सही स्थान पर कॉपी करना
          if [ -f icon.png ]; then
            cp icon.png myapp/www/icon.png
          fi
          
          cd myapp
          
          # कॉन्फ़िगरेशन फ़ाइल में लोगो का टैग सुरक्षित तरीके से डालना
          echo '<icon src="www/icon.png" />' > logo.xml
          sed -i '/<\/widget>/r logo.xml' config.xml
          
          cordova platform add android

      - name: Build APK (For Testing)
        run: |
          cd myapp
          cordova build android --debug --max-workers=2

      - name: Build AAB (For Play Store)
        run: |
          cd myapp
          cordova build android --release -- --packageType=bundle

      - name: Upload Files
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-Files
          path: |
            myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
            myapp/platforms/android/app/build/outputs/bundle/release/app-release.aab
